simulation:
  name: dsx-lab
  # ConnectX example (also add the same network_pci device to each referenced pool):
  # links:
  #   - endpoints:
  #       - { node: master-a, network_pci: nic1, interface: p0 }
  #       - { node: master-b, network_pci: nic1, interface: p0 }
cluster:
  name: ocp
  version: "4.19"
  architecture: x86_64
  base_dns_domain: dsx.air.local
  machine_networks: [192.168.200.0/24]
  cluster_networks: [{ cidr: 10.128.0.0/14, host_prefix: 23 }]
  service_networks: [172.30.0.0/16]
  api_vips: [192.168.200.10]
  ingress_vips: [192.168.200.11]
  ntp_sources: []
  control_plane:
    count: 3
    # names: [master-a, master-b, master-c]
    cpu: 16
    memory_mb: 65536
    disk_gb: 100
    # hardware:
    #   emulation_type: HOST
    #   network_pci:
    #     - { name: nic1, emulation_type: NIC_ETHERNET, model: connectx7 }
  workers: { count: 2, cpu: 8, memory_mb: 32768, disk_gb: 100 }
auth:
  air_api_key_file: ~/.config/dsx-air/air-api-key
  ai_offlinetoken_file: ~/.config/dsx-air/ai-offlinetoken
  pull_secret_file: ~/.config/dsx-air/pull-secret.json
  ssh_public_key_file: ~/.ssh/id_ed25519.pub
  jump_host_password_file: ~/.config/dsx-air/jump-host-password
